name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Commandline Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

      - name: Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses and Install Platforms
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Cordova Globally
        run: npm install -g cordova

      - name: Create Mobile App Wrapper
        run: |
          cordova create myapp com.crypto.bot CryptoBot
          cd myapp
          cordova platform add android@13.0.0

      - name: Allow cleartext to local server
        run: |
          python3 - <<'PY'
          p = 'myapp/config.xml'
          s = open(p).read()
          tag = '<platform name="android">'
          if tag not in s:
              raise SystemExit('config.xml has no android platform block')
          snippet = '''
                  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
                      <application android:usesCleartextTraffic="true" />
                  </edit-config>'''
          open(p, 'w').write(s.replace(tag, tag + snippet, 1))
          PY

      - name: Copy Custom Frontend UI
        run: |
          rm -rf myapp/www/*
          cp -r www/* myapp/www/

      - name: Build Debug APK
        run: |
          cd myapp
          cordova build android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
